async function ensureLogin(){
  const accounts = msalInstance.getAllAccounts();
  if(accounts.length > 0){ msalInstance.setActiveAccount(accounts[0]); return accounts[0]; }
  const result = await msalInstance.loginPopup({ scopes: GRAPH_SCOPES });
  msalInstance.setActiveAccount(result.account);
  return result.account;
}

async function getGraphToken(){
  const account = await ensureLogin();
  try{
    const r = await msalInstance.acquireTokenSilent({ scopes: GRAPH_SCOPES, account });
    return r.accessToken;
  }catch(e){
    const r = await msalInstance.acquireTokenPopup({ scopes: GRAPH_SCOPES });
    return r.accessToken;
  }
}

async function graphFetch(path, options={}){
  const token = await getGraphToken();
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    ...options,
    headers: {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json",
      ...(options.headers||{})
    }
  });
  if(!res.ok) throw new Error(`Graph error ${res.status}: ${await res.text()}`);
  return res.status===204 ? null : res.json();
}

function nextPRNumero(){
  var hoy=new Date().toISOString().slice(0,10);
  // El consecutivo es GLOBAL (nunca se reinicia, ni por día ni por año)
  var max=0;
  APP.docs.forEach(function(d){
    if(d.tipo!=='PR'||!d.numero)return;
    var m=d.numero.match(/^PR \d{4}-\d{2}-\d{2}-(\d+)/);
    if(m){
      var n=parseInt(m[1],10);
      if(n>max)max=n;
    }
  });
  var next=max+1;
  return 'PR '+hoy+'-'+String(next).padStart(4,'0');
}

function resolverDefaultTec(tinfo,mat){
  if(!tinfo||!tinfo.opciones||tinfo.opciones.length===0)return 0;
  if(!tinfo.mat_default)return tinfo.default||0;
  var matL=(mat||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  var esAgua=matL==='agua';
  var esHarinaTrigo=matL.includes('harina')&&matL.includes('trigo');
  if(tinfo.mat_default.incluye_agua!==undefined&&esAgua)return tinfo.mat_default.incluye_agua;
  if(tinfo.mat_default.incluye_harina_trigo!==undefined&&esHarinaTrigo)return tinfo.mat_default.incluye_harina_trigo;
  return tinfo.default||0;
}

function renderModalMatrizCat(q){
  var ex=document.getElementById('ens-modal');if(ex)ex.remove();

  var listHtml=grupos.length===0?'<div class="modal-none">Sin resultados</div>':grupos.map(function(g){return'<div class="modal-group">'+g.label+'</div>'+g.items.map(function(en){var yaEsta=yaIds.indexOf(en.id)!==-1;return'<div class="modal-mat-item'+(yaEsta?' modal-ya-sel':'')+'" data-eid="'+en.id+'"><span class="modal-item-txt">'+en.n+(yaEsta?'<span class="modal-ya-badge"> \u2713 seleccionado \u2014 clic para quitar</span>':'')+'<br><span class="modal-item-sub" style="color:#4b5563;">'+en.t+'</span>'+(en.a?'<br><span class="modal-item-sub" style="color:#9ca3af;font-style:italic;">'+en.a+'</span>':'')+'<br><span class="modal-item-sub">$ '+fmt(en.p)+'</span></span>'+(yaEsta?'':'<span class="modal-mat-arrow">\u203a</span>')+'</div>';}).join('');}).join('');

function diffVersiones(vieja,nueva){
  var cambios=[];
  var camposSimples=[
    ['cliente','Razón social'],['cuit','CUIT'],['contacto','Contacto'],
    ['telefono','Teléfono'],['email','Email'],['fecha','Fecha'],
    ['validoHasta','Válido hasta'],['tarifa','Tarifa'],['diasEntrega','Días de entrega'],
    ['bonifG','Bonificación general'],['rpocTipo','Tipo RPOC'],['codigoRojo','Código Rojo (urgencia)'],
  ];
  camposSimples.forEach(function(c){
    var k=c[0],label=c[1];
    var vv=vieja[k]!=null?String(vieja[k]):'';
    var nv=nueva[k]!=null?String(nueva[k]):'';
    if(vv!==nv){
      cambios.push(label+': "'+(vv||'—')+'" → "'+(nv||'—')+'"');
    }
  });
  // Observaciones (seleccionadas + manual)
  var obsV=(vieja.obsSeleccionadas||[]).slice().sort().join(',');
  var obsN=(nueva.obsSeleccionadas||[]).slice().sort().join(',');
  if(obsV!==obsN)cambios.push('Observaciones predefinidas modificadas');
  if((vieja.obsManual||'')!==(nueva.obsManual||''))cambios.push('Observación manual modificada');
  // Motivos RPOC
  var motV=(vieja.rpocMotivos||[]).slice().sort().join(',');
  var motN=(nueva.rpocMotivos||[]).slice().sort().join(',');
  if(motV!==motN)cambios.push('Motivos RPOC modificados');
  // Ensayos (rows)
  var rowsV=vieja.rows||[],rowsN=nueva.rows||[];
  var byUidV={};rowsV.forEach(function(r){if(r.uid)byUidV[r.uid]=r;});
  var byUidN={};rowsN.forEach(function(r){if(r.uid)byUidN[r.uid]=r;});
  var nombreRow=function(r){
    if(!r)return'—';
    if(r.nombreLibre)return r.nombreLibre;
    var e=typeof getE==='function'?getE(r.eid):null;
    return (e?e.n:('#'+r.eid))+(r.mat1?' — '+r.mat1:'');
  };
  rowsN.forEach(function(r){
    if(r.uid&&!byUidV[r.uid])cambios.push('Ensayo agregado: '+nombreRow(r));
  });
  rowsV.forEach(function(r){
    if(r.uid&&!byUidN[r.uid])cambios.push('Ensayo eliminado: '+nombreRow(r));
  });
  rowsN.forEach(function(r){
    if(!r.uid||!byUidV[r.uid])return;
    var rv=byUidV[r.uid];
    if((rv.cant||0)!==(r.cant||0))cambios.push('Cantidad de "'+nombreRow(r)+'": '+(rv.cant||0)+' → '+(r.cant||0));
    if((rv.bonif||0)!==(r.bonif||0))cambios.push('Bonificación de "'+nombreRow(r)+'": '+(rv.bonif||0)+'% → '+(r.bonif||0)+'%');
    if((rv.precioManual||null)!==(r.precioManual||null))cambios.push('Precio manual de "'+nombreRow(r)+'" modificado');
  });
  return cambios;
}

async function loadStorage(){
  const [pres, resp, log, fueraLeo, config, catalogoLeo, eventosGm] = await Promise.all([
    graphFetch(`${BASE}/tables('TablaPresupuestos')/rows`),
    graphFetch(`${BASE}/tables('TablaResponsables')/rows`),
    graphFetch(`${BASE}/tables('TablaLogFirmas')/rows`),
    graphFetch(`${BASE}/tables('TablaEnsayosFueraLEO')/rows`),
    graphFetch(`${BASE}/tables('TablaConfiguracion')/rows`),
    graphFetch(`${BASE}/tables('TablaCatalogoLEO')/rows`),
    graphFetch(`${BASE}/tables('TablaEventosGM')/rows`)
  ]);

  // TablaCatalogoLEO: columnas ID, Nombre, Alcance, Tecnica, PrecioLeo, PrecioConsorcio, MuestraMinima, Grupo, PrecioProvisorio
  EN_ALL = catalogoLeo.value.map(r => {
    const v = r.values[0];
    const item = { id: Number(v[0]), n: v[1], a: v[2], t: v[3], p: Number(v[4])||0, m: v[6], g: v[7] };
    if(v[5] !== '' && v[5] != null) item.pc = Number(v[5]);
    if(v[8] === 'SI' || v[8] === true) item.precioLeoProvisorio = true;
    return item;
  });

  // TablaEventosGM: columnas Matriz, Evento — la matriz "(Construcciones y genes)" son las fijas para todas las matrices
  GM_CONSTRUCCIONES = [];
  GM_EVENTOS = {};
  eventosGm.value.forEach(r => {
    const v = r.values[0];
    const matriz = v[0], evento = v[1];
    if(matriz === '(Construcciones y genes)'){
      GM_CONSTRUCCIONES.push(evento);
    } else {
      if(!GM_EVENTOS[matriz]) GM_EVENTOS[matriz] = [];
      GM_EVENTOS[matriz].push(evento);
    }
  });

  APP.docs = pres.value.map(r => {
    const v = r.values[0];
    try{ return JSON.parse(v[15]); }catch(e){ return null; } // columna DatosJSON, índice 15
  }).filter(Boolean);

  // TablaResponsables: columnas Nombre, Rol, Area — Rol = "Elaborador" | "Revisor" | "Aprobador"
  APP.elaboradores = resp.value.filter(r => r.values[0][1] === 'Elaborador').map(r => r.values[0][0]);
  APP.revisores = resp.value.filter(r => r.values[0][1] === 'Revisor').map(r => r.values[0][0]);
  APP.approvers = resp.value.filter(r => r.values[0][1] === 'Aprobador').map(r => r.values[0][0]);

  APP.sigLog = log.value.map(r => {
    const v = r.values[0];
    return {role:v[0], name:v[1], ts:v[2], tipo:v[3], numero:v[4], version:v[5], cliente:v[6]};
  });

  // TablaConfiguracion: columnas Clave, Valor — ej. fila "TipoCambio" / "1550"
  APP.config = {};
  config.value.forEach(r => {
    const v = r.values[0];
    APP.config[v[0]] = v[1];
  });
  if(APP.config.CodigoRojoPrecio) GM_CODIGO_ROJO = Number(APP.config.CodigoRojoPrecio) || GM_CODIGO_ROJO;
  if(APP.config.GmPrecioCualitBase) GM_PRECIO_CUALIT_BASE = Number(APP.config.GmPrecioCualitBase) || GM_PRECIO_CUALIT_BASE;
  if(APP.config.GmPrecioCualitAdic) GM_PRECIO_CUALIT_ADIC = Number(APP.config.GmPrecioCualitAdic) || GM_PRECIO_CUALIT_ADIC;
  if(APP.config.GmPrecioCuantitBase) GM_PRECIO_CUANTIT_BASE = Number(APP.config.GmPrecioCuantitBase) || GM_PRECIO_CUANTIT_BASE;
  if(APP.config.GmPrecioCuantitAdic) GM_PRECIO_CUANTIT_ADIC = Number(APP.config.GmPrecioCuantitAdic) || GM_PRECIO_CUANTIT_ADIC;

  // TablaEnsayosFueraLEO: columnas Clasificacion, Matriz, Grupo, Ensayo, Tecnica, Precio, Derivante
  // Se reconstruye la jerarquía cls -> mats -> m -> grps -> g -> ens -> {e,t,p,d} que espera el modal
  const clsMap = new Map();
  fueraLeo.value.forEach(r => {
    const v = r.values[0];
    const cls = v[0], mat = v[1], grp = v[2], ens = v[3], tec = v[4], precio = v[5], derivante = v[6];
    if(!clsMap.has(cls)) clsMap.set(cls, new Map());
    const matsMap = clsMap.get(cls);
    if(!matsMap.has(mat)) matsMap.set(mat, new Map());
    const grpsMap = matsMap.get(mat);
    if(!grpsMap.has(grp)) grpsMap.set(grp, []);
    grpsMap.get(grp).push({e: ens, t: tec, p: (precio===''||precio==null)?null:precio, d: (derivante||'').trim()});
  });
  BIB_FUERA_LEO = Array.from(clsMap.entries()).map(([cls, matsMap]) => ({
    cls,
    mats: Array.from(matsMap.entries()).map(([m, grpsMap]) => ({
      m,
      grps: Array.from(grpsMap.entries()).map(([g, ens]) => ({ g, ens }))
    }))
  }));

  render();
}

// --- Sumar al catálogo un ensayo "fuera de LEO" cargado a mano, si todavía no está ---
function ensayoFueraLeoExiste(mat,ens){
  var matN=(mat||'').trim().toLowerCase();
  var ensN=(ens||'').trim().toLowerCase();
  return BIB_FUERA_LEO.some(function(clsObj){
    return (clsObj.mats||[]).some(function(matObj){
      if((matObj.m||'').trim().toLowerCase()!==matN) return false;
      return (matObj.grps||[]).some(function(grpObj){
        return (grpObj.ens||[]).some(function(en){ return (en.e||'').trim().toLowerCase()===ensN; });
      });
    });
  });
}
async function agregarEnsayoFueraLeoSiNoExiste(mat,ens,tec,derivante){
  if(!mat||!ens) return;
  if(ensayoFueraLeoExiste(mat,ens)) return;
  var CLS_SIN_CLASIFICAR='Sin clasificar', GRP_SIN_CLASIFICAR='Sin clasificar';
  derivante=(derivante||'').trim();
  // Actualiza en memoria para que aparezca ya mismo en el catálogo de esta sesión
  var clsObj=BIB_FUERA_LEO.find(function(c){return c.cls===CLS_SIN_CLASIFICAR;});
  if(!clsObj){clsObj={cls:CLS_SIN_CLASIFICAR,mats:[]};BIB_FUERA_LEO.push(clsObj);}
  var matObj=clsObj.mats.find(function(m){return m.m===mat;});
  if(!matObj){matObj={m:mat,grps:[]};clsObj.mats.push(matObj);}
  var grpObj=matObj.grps.find(function(g){return g.g===GRP_SIN_CLASIFICAR;});
  if(!grpObj){grpObj={g:GRP_SIN_CLASIFICAR,ens:[]};matObj.grps.push(grpObj);}
  grpObj.ens.push({e:ens,t:tec||'',p:null,d:derivante});
  // Guarda en SharePoint (silencioso: si falla, no interrumpe el guardado del presupuesto)
  try{
    await graphFetch(`${BASE}/tables('TablaEnsayosFueraLEO')/rows/add`, {
      method: "POST", body: JSON.stringify({ values: [[CLS_SIN_CLASIFICAR, mat, GRP_SIN_CLASIFICAR, ens, tec||'', '', derivante]] })
    });
  }catch(e){
    console.error('Error al sumar ensayo nuevo a TablaEnsayosFueraLEO:', e);
  }
}

async function saveResponsablesRole(rol, lista){

  const rowsResp = await graphFetch(`${BASE}/tables('TablaResponsables')/rows`);
  const indices = [];
  rowsResp.value.forEach((r, i) => { if(r.values[0][1] === rol) indices.push(i); });
  for(let j = indices.length - 1; j >= 0; j--){
    await graphFetch(`${BASE}/tables('TablaResponsables')/rows/$/itemAt(index=${indices[j]})`, { method: "DELETE" });
  }
  for(const nombre of lista){
    await graphFetch(`${BASE}/tables('TablaResponsables')/rows/add`, {
      method: "POST", body: JSON.stringify({ values: [[nombre, rol, ""]] })
    });
  }

async function recordSig(role){
  const doc=APP.form;if(!doc||!doc[role])return;
  const ts=new Date().toISOString();doc[role+'Ts']=ts;
  const entry={role,name:doc[role],ts,tipo:doc.tipo,numero:doc.numero,version:doc.version,cliente:doc.cliente||'(sin cliente)'};
  APP.sigLog=[...APP.sigLog,entry];
  try{ await appendSigLogRemote(entry); }catch(e){ console.error('Error al guardar firma en SharePoint:', e); }
  // Transición semi-automática de estado para RPOC
  if(doc.tipo==='RPOC'){
    // tieneSGI: fuera de LEO siempre requiere SGI; o rpocTipo técnica/ambas
    var tieneSGI=(doc.rows||[]).some(function(r){return r.fueraLeo;})
      ||(doc.rpocTipo==='tecnica'||doc.rpocTipo==='ambas');
    if(role==='aprobo'){
      // Firma Adm registrada
      if(tieneSGI){
        // Flujo completo Adm → SGI
        if(doc.estado==='en_revision_adm') doc.estado='en_revision_sgi';
      } else {
        // Solo Adm: pasa directo a Aprobado
        if(doc.estado==='en_revision_adm') doc.estado='aprobado';
      }
    } else if(role==='reviso'){
      // Firma SGI registrada → Aprobado
      if(doc.estado==='en_revision_sgi') doc.estado='aprobado';
    }
  }
  render();
}

var _pdfDoc = null;

function mostrarPopoverPDF(doc, btn){
  _pdfDoc = doc;

  if(!pop) return;
  var rect = btn.getBoundingClientRect();
  var left = Math.min(rect.left, window.innerWidth - 275);
  var top = rect.bottom + 6;
  if(top + 260 > window.innerHeight) top = rect.top - 265;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.display = 'block';
}

function cerrarPopoverPDF(){
  var pop = document.getElementById('pdf-popover');
  if(pop) pop.style.display = 'none';
  // NO limpiar _pdfDoc acá — lo necesita ejecutarPDF
}

function ejecutarPDF(modo){
  var doc = _pdfDoc;  // capturar ANTES de cerrar
  cerrarPopoverPDF();
  _pdfDoc = null;     // limpiar después de capturar
  if(!doc) return;
  if(modo === 'presupuesto'){
    var saved=APP.form; APP.form=doc; generarPDF(); APP.form=saved;
  } else if(modo === 'etiqueta'){
    generarEtiqueta(doc);
  } else {
    var saved=APP.form; APP.form=doc; generarPDF(); APP.form=saved;
    setTimeout(function(){ generarEtiqueta(doc); }, 800);
  }
}

function generarEtiqueta(doc){
  doc = doc || APP.form;
  var numero    = doc.numero    || '—';

function html2canvasPDF(iframeDoc){
  var body=iframeDoc.body;
  var nombre=nombreArchivoDoc(APP.form)+'_v'+(APP.form.version||0)+'.pdf';
  html2canvas(body,{scale:2,useCORS:true,backgroundColor:'#ffffff',width:794,windowWidth:794}).then(function(canvas){
    var imgData=canvas.toDataURL('image/jpeg',0.95);
    var pdf=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    var pdfW=pdf.internal.pageSize.getWidth();
    var pdfH=pdf.internal.pageSize.getHeight();
    var imgH=(canvas.height*pdfW)/canvas.width;
    var y=0;
    while(y<imgH){if(y>0)pdf.addPage();pdf.addImage(imgData,'JPEG',0,-y,pdfW,imgH);y+=pdfH;}
    pdf.save(nombre);
    var iframe=document.getElementById('pdf-iframe');
    if(iframe)iframe.src='about:blank';
  });
}

var _envioDocId=null;

function abrirPopoverEnvio(docId, btn){
  _envioDocId=docId;
  var doc=APP.docs.find(function(d){return d.id===docId;});
  if(!doc)return;
  var pop=document.getElementById('envio-popover');
  var info=document.getElementById('envio-doc-info');

  document.getElementById('envio-quien').value='';
  document.getElementById('envio-nota').value='';
  // Posicionar cerca del botón
  var rect=btn.getBoundingClientRect();
  var left=Math.min(rect.left, window.innerWidth-295);
  var top=rect.bottom+6;
  if(top+200>window.innerHeight) top=rect.top-210;
  pop.style.left=left+'px';
  pop.style.top=top+'px';
  pop.style.display='block';
  setTimeout(function(){document.getElementById('envio-quien').focus();},50);
}

function cerrarPopoverEnvio(){

function confirmarEnvio(){

  if(!quien){alert('Ingresá tu nombre para registrar el envío.');return;}

function filtrarClientes(q){
  var dd=document.getElementById('rs-dropdown');
  if(!dd)return;
  var val=(q||'').trim();
  if(val.length<2){dd.style.display='none';return;}
  var norm=val.toLowerCase();
  var matches=[];
  // Buscar en CLIENTES_DB (con contactos)
  CLIENTES_DB.forEach(function(x){
    if(x.rs.toLowerCase().includes(norm)) matches.push({rs:x.rs,cnt:(x.c&&x.c.length)||0});
  });
  // Completar con CUITS_EXTRA si faltan resultados
  if(matches.length<30){
    for(var i=0;i<CUITS_EXTRA.length&&matches.length<40;i++){
      var s=CUITS_EXTRA[i];
      var pipe=s.indexOf('|');
      var rs=s.slice(0,pipe);
      if(rs.toLowerCase().includes(norm)){
        var yaEsta=false;
        for(var j=0;j<matches.length;j++){if(matches[j].rs===rs){yaEsta=true;break;}}
        if(!yaEsta) matches.push({rs:rs,cnt:0});
      }
    }
  }
  if(!matches.length){dd.style.display='none';return;}
  dd.innerHTML=matches.map(function(x,i){
    return '<div data-idx="'+i+'" style="padding:6px 10px;cursor:pointer;border-bottom:0.5px solid #f3f4f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" onmousedown="elegirClienteIdx('+i+')">'
      +'<span style="font-weight:500;">'+x.rs+'</span>'
      +(x.cnt?' <span style="color:#9ca3af;font-size:10px;">('+x.cnt+' contacto'+(x.cnt>1?'s':'')+')</span>':'')
      +'</div>';
  }).join('');
  dd._matches=matches;
  dd.style.display='block';
}

function elegirClienteIdx(i){
  var dd=document.getElementById('rs-dropdown');
  var matches=dd&&dd._matches;
  if(!matches||!matches[i])return;
  var item=matches[i];
  elegirCliente(item.rs);
}
function elegirCliente(rs){
  var match=CLIENTES_DB.find(function(x){return x.rs===rs;});
  APP.form.cliente=rs;
  APP.form.contactoManual=false;
  APP.form.contacto='';
  APP.form.email='';
  APP.form.telefono='';
  // Buscar CUIT: primero en CLIENTES_DB, luego en CUITS_EXTRA
  if(match&&match.cuit){
    APP.form.cuit=match.cuit;
  } else {
    var prefix=rs+'|';
    var extraEntry=CUITS_EXTRA.find(function(s){return s.startsWith(prefix);});
    APP.form.cuit=extraEntry?extraEntry.slice(prefix.length):'';
  }
  // Si hay un solo contacto, auto-completar
  if(match&&match.c.length===1){
    APP.form.contacto=match.c[0].n||'';
    APP.form.email=match.c[0].e||'';
    APP.form.telefono=match.c[0].t||'';
  }
  var dd=document.getElementById('rs-dropdown');
  if(dd)dd.style.display='none';
  render();
}

function selContacto(val){
  if(!val)return;
  if(val==='manual'){
    APP.form.contactoManual=true;
    APP.form.contacto='';
    render();
    // Dar foco al input manual después del render
    setTimeout(function(){
      var inp=document.querySelector('[data-df-blur="contacto"]');
      if(inp)inp.focus();
    },50);
    return;
  }
  APP.form.contactoManual=false;
  var match=CLIENTES_DB.find(function(x){return x.rs===APP.form.cliente;});
  if(!match)return;
  var c=match.c[parseInt(val)];
  if(!c)return;
  APP.form.contacto=c.n||'';
  APP.form.email=c.e||'';
  APP.form.telefono=c.t||'';
  render();
}

// Event delegation global en #app para botones críticos
function initGlobalEvents(){
  var appEl=document.getElementById('app');
  if(!appEl||appEl._delegated)return;
  appEl._delegated=true;
  // Cerrar dropdown de clientes al click fuera
  document.addEventListener('click',function(e){
    var dd=document.getElementById('rs-dropdown');
    var inp=document.getElementById('rs-input');
    if(dd&&inp&&!dd.contains(e.target)&&e.target!==inp){
      dd.style.display='none';
    }
  });

  appEl.addEventListener('click',function(e){
    // Botones de acción del toolbar del formulario
    var actionBtn=e.target.closest('[data-action]');
    if(actionBtn){
      var action=actionBtn.dataset.action;
      if(action==='enviar-revision'){
        var tieneFueraLeo=(APP.form.rows||[]).some(function(r){return r.fueraLeo;});
        var accionVal=tieneFueraLeo?'guardar-fuera-leo':'solicitar-rev-adm';
        var err=validarDoc(accionVal);
        if(mostrarErrores(err,'No se puede enviar a revisión'))return;
        APP.form._pedirRevision=true;
        saveDoc();return;
      }
      if(action==='finalizar-pr'){
        var err=validarDoc('finalizar-pr');
        if(mostrarErrores(err,'No se puede finalizar el presupuesto'))return;
        APP.form.estado='finalizado';saveDoc();return;
      }
      if(action==='volver-borrador'){APP.form.estado='borrador';saveDoc();return;}
      if(action==='solicitar-rev-adm'){
        var err=validarDoc('solicitar-rev-adm');
        if(mostrarErrores(err,'No se puede solicitar revisión administrativa'))return;
        APP.form.solicitarRevAdm=true;
        APP.form._pedirRevision=true;
        saveDoc();return;
      }
    }

    // Ordenar columna
    var thSort=e.target.closest('[data-sort-col]');
    if(thSort&&APP.view==='list'){
      var col=thSort.dataset.sortCol;
      if(APP.filters.sortCol===col){
        APP.filters.sortDir=APP.filters.sortDir==='asc'?'desc':'asc';
      } else {
        APP.filters.sortCol=col;
        APP.filters.sortDir='asc';
      }
      render();return;
    }
    // Botón editar
    var editBtn=e.target.closest('[data-docid]');
    if(editBtn){openEdit(editBtn.dataset.docid);return;}
    // Botón ver (solo lectura)
    var verBtn=e.target.closest('[data-verid]');
    if(verBtn){openEdit(verBtn.dataset.verid,true);return;}
    // Botón envío al cliente
    var enviarBtn=e.target.closest('[data-enviar]');
    if(enviarBtn){abrirPopoverEnvio(enviarBtn.dataset.enviar, enviarBtn);return;}

    // Botón PDF en lista
    var pdfBtn=e.target.closest('[data-pdf]');
    if(pdfBtn){
      var docId=pdfBtn.dataset.pdf;
      var docToExport=APP.docs.find(function(d){return d.id===docId;});
      if(docToExport){mostrarPopoverPDF(docToExport,pdfBtn);}
      return;
    }
    // Botón eliminar
    var delBtn=e.target.closest('[data-del]');
    if(delBtn){
      if(confirm('¿Eliminar este documento?')){
        var idBorrar=delBtn.dataset.del;
        APP.docs=APP.docs.filter(function(d){return d.id!==idBorrar;});
        render();
        deleteDocRemote(idBorrar).catch(function(e){console.error('Error al eliminar en SharePoint:',e);alert('No se pudo eliminar en SharePoint.');});
      }
      return;
    }
    // Stat cards
    var card=e.target.closest('[data-flt-e]');
    if(card){
      APP.filters.estado=card.dataset.fltE;
      APP.filters.tipo=card.dataset.fltT||'todos';
      render();return;
    }
    // Selectores de estado inline
    if(e.target.dataset&&e.target.dataset.eid){
      var d=APP.docs.find(function(x){return x.id===e.target.dataset.eid;});
      if(d){
        d.estado=e.target.value;d.updatedAt=new Date().toISOString();
        render();
        saveDocRemote(d).catch(function(e){console.error('Error al guardar estado en SharePoint:',e);alert('No se pudo guardar en SharePoint.');});
      }
      return;
    }
    // btn-back
    if(e.target.id==='btn-back'){openList();return;}
    // btn agregar fuera de LEO
    if(e.target.id==='addrow'||e.target.closest('#addrow')){openEnsayoModal();return;}
    if(e.target.id==='addrow-fuera'||e.target.closest('#addrow-fuera')){openModalFueraLeo();return;}
    // btn-save
    if(e.target.id==='btn-save'){saveDoc();return;}
    // btn-pdf
    if(e.target.id==='btn-pdf'){
      if(APP.form&&APP.form.estado==='aprobado'){generarPDF();}
      else{alert('Solo disponible en estado Aprobado.');}
      return;
    }
    // btn-toggle-entrega
    if(e.target.id==='toggle-pie-entrega'||e.target.closest('#toggle-pie-entrega')){
      APP.ui.showEntrega=!APP.ui.showEntrega;render();return;
    }
    // btn-show-obs
    if(e.target.id==='btn-show-obs'){APP.ui.showObs=!APP.ui.showObs;render();return;}
    // btn-toggle-entrega (fsec)
    if(e.target.id==='btn-toggle-entrega'){APP.ui.showEntrega=!APP.ui.showEntrega;render();return;}
  });
  // Change delegation
  appEl.addEventListener('change',function(e){
    var el=e.target;
    // Estado inline manejado via onchange directo en el select
    // Observaciones (data-obsk) — NO hacer render para no cerrar el dropdown
    if(el.dataset.obsk){
      var k=el.dataset.obsk;
      var arr=(APP.form.obsSeleccionadas||[]).slice();
      if(el.checked){if(arr.indexOf(k)===-1)arr.push(k);}
      else{arr=arr.filter(function(x){return x!==k;});}
      APP.form.obsSeleccionadas=arr;
      // Solo actualizar el bloque de seleccionadas sin re-render completo
      var obsOut=document.querySelector('.obs-seleccionadas');
      var obsNone=document.querySelector('.obs-none');
      if(arr.length>0){
        var html=arr.map(function(kk){var o=OBS_LISTA.find(function(x){return x.k===kk;});return o?'<p>• '+o.t+'</p>':'';}).join('');
        if(obsOut){obsOut.innerHTML=html;}
        else{
          var container=el.closest('.obs-selector')||el.closest('.fsec');
          if(container){var d=document.createElement('div');d.className='obs-seleccionadas';d.innerHTML=html;container.appendChild(d);}
        }
        if(obsNone)obsNone.style.display='none';
      } else {
        if(obsOut)obsOut.innerHTML='';
        if(obsNone)obsNone.style.display='';
      }
      return;
    }
    // data-df
    if(el.dataset.df){APP.form[el.dataset.df]=el.type==='number'?Number(el.value):el.type==='checkbox'?el.checked:el.value;render();return;}
    // data-df-blur
    if(el.dataset.dfBlur){APP.form[el.dataset['dfBlur']]=el.value;return;}
    // data-dr
    if(el.dataset.dr){APP.form[el.dataset.dr]=el.type==='number'?Number(el.value):el.type==='checkbox'?el.checked:el.value;render();return;}
  });
  // Input delegation
  appEl.addEventListener('input',function(e){
    var el=e.target;
    if(el.dataset.df&&el.type!=='number'){APP.form[el.dataset.df]=el.value;}
    else if(el.dataset.df&&el.type==='number'){APP.form[el.dataset.df]=Number(el.value);}
    if(el.id==='filter-q'){APP.filters.q=el.value;render();}
    if(el.dataset.dr&&el.type!=='checkbox'){APP.form[el.dataset.dr]=el.type==='number'?Number(el.value):el.value;}
    if(el.id==='new-apv'){APP.ui.newApv=el.value;}
    if(el.id==='msearch'){/* handled by modal */}
  });
}

function renderList(){
  const {filters,docs}=APP;
  const filtered=docs.filter(d=>{
    const es=efectEst(d);
    // Históricos: ocultar por defecto
    if(filters.estado!=='todos'&&es!==filters.estado)return false;
    if(filters.tipo!=='todos'&&d.tipo!==filters.tipo)return false;
    if(filters.vencidos==='vencidos'&&(!d.validoHasta||d.validoHasta>=TODAY))return false;
    if(filters.vencidos==='vigentes'&&d.validoHasta&&d.validoHasta<TODAY)return false;
    if(filters.q){const q=filters.q.toLowerCase();return(d.cliente+d.numero+d.tipo+(d.elaboro||'')).toLowerCase().includes(q);}
    return true;
  }).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
  const stats={total:docs.length,borrador:0,finalizado:0,enviado:0,aprobado:0,rechazado:0,en_revision_adm:0,en_revision_sgi:0};
  // Ordenar: activos primero (por columna), luego rechazados, luego históricos al fondo
  const filteredSorted=filtered.slice().sort(function(a,b){
    var aH=!!a.historico, bH=!!b.historico;
    var aR=a.estado==='rechazado'&&!aH, bR=b.estado==='rechazado'&&!bH;
    if(aH&&!bH)return 1; if(bH&&!aH)return -1;
    if(aR&&!bR)return 1; if(bR&&!aR)return -1;
    var col=filters.sortCol, dir=filters.sortDir==='asc'?1:-1;
    if(!col)return 0;
    var av=col==='total'?docTotal(a):(a[col]||'');
    var bv=col==='total'?docTotal(b):(b[col]||'');
    if(typeof av==='number'&&typeof bv==='number')return(av-bv)*dir;
    return String(av).localeCompare(String(bv))*dir;
  });
  docs.forEach(d=>{const e=efectEst(d);if(e in stats)stats[e]++;});
  return`
  <div class="topbar">
    <div class="topbar-logo">
      <div class="topbar-logo-left">

function resolverMuestra(m_raw, matriz){
  if(!m_raw) return '—';
  var mat = matriz || '';
  var matL = mat.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  var FRUTAS=['Manzana','Pera','Durazno','Damasco','Ciruela','Cereza','Frutilla','Arándano',
    'Frambuesa','Uva','Kiwi','Higo','Granada','Caqui','Membrillo','Níspero',
    'Sandía','Melón','Banana','Mango','Palta','Maracuyá','Ananá','Naranja','Mandarina','Limón','Pomelo','Lima'];
  var HORTALIZAS=['Tomate','Papa','Cebolla','Ajo','Zanahoria','Lechuga','Espinaca','Acelga','Remolacha',
    'Zapallo','Zucchini','Berenjena','Pimiento','Choclo','Pepino','Alcaucil','Coliflor',
    'Brócoli','Repollo','Apio','Puerro','Rábano','Nabo','Batata','Mandioca','Chaucha',
    'Arvejas frescas','Habas frescas','Hinojo','Endivia','Achicoria'];
  var ACEITES=['Aceite de soja','Aceite de girasol','Aceite de oliva','Aceite de maíz','Aceite de canola',
    'Aceite de maní','Aceite de coco','Aceite de palma','Aceite de arroz','Aceite de sésamo'];

  var esFruta=FRUTAS.some(function(f){return f.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')=== matL;});
  var esHortaliza=HORTALIZAS.some(function(h){return h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')=== matL;});
  var esAceite=ACEITES.some(function(a){return a.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')=== matL;});
  var esHuevo=matL.includes('huevo');
  var esSorgo=matL==='sorgo';

  // Caso: "1000 mL (aceites) · 6 u. (huevos) · 1 kg (resto)"
  if(m_raw.includes('mL') && m_raw.includes('huevo')){
    if(esAceite) return '1000 mL';
    if(esHuevo)  return '6 u.';
    return '1 kg';
  }
  // Caso: "1000 mL (aceites) · 1 kg (resto)"
  if(m_raw.includes('mL') && m_raw.includes('aceite') && m_raw.includes('resto')){
    return esAceite ? '1000 mL' : '1 kg';
  }
  // Caso: "1 kg (maíz/soja) · 4 u. (frutas) · 300 g (hortalizas)"
  if(m_raw.includes('frutas') && m_raw.includes('hortalizas')){
    if(esFruta)    return '4 u.';
    if(esHortaliza) return '300 g';
    return '1 kg';
  }
  // Caso: "1 kg (cereales) · 4 u. (frutas)"
  if(m_raw.includes('frutas') && m_raw.includes('cereales')){
    return esFruta ? '4 u.' : '1 kg';
  }
  // Caso: "Soja: 400 g · Sorgo: 300 g"
  if(m_raw.startsWith('Soja:')){
    return esSorgo ? '300 g' : '400 g';
  }
  // Caso simple: un solo valor con posible aclaración entre paréntesis
  // Extraer solo número + unidad antes del primer paréntesis o punto medio
  var simple=m_raw.split('·')[0].split('(')[0].trim();
  return simple || m_raw;
}

function validarDoc(accion){
  var doc=APP.form;
  var errores=[];
  var rows=doc.rows||[];
  var tieneFueraLeo=rows.some(function(r){return r.fueraLeo;});
  var tieneEnsayosLeo=rows.some(function(r){return !r.fueraLeo&&r.eid;});
  var tieneAlgunEnsayo=rows.length>0;

  // ── Campos base comunes ──────────────────────────────────────────────────
  function validarBase(){
    if(!doc.cliente||!doc.cliente.trim()) errores.push('• Razón social es obligatoria');
    if(!doc.validoHasta) errores.push('• Válido hasta es obligatorio');
    if(!doc.elaboro||!doc.elaboro.trim()) errores.push('• Debe seleccionar quién elaboró (sección Firmas)');
  }

  // ── PR: Borrador → Finalizado ────────────────────────────────────────────
  if(accion==='finalizar-pr'){
    validarBase();
    if(!tieneAlgunEnsayo) errores.push('• Debe tener al menos un ensayo cargado');
  }

  // ── RPOC solo Admin: PR → Solicitar revisión Adm ────────────────────────
  if(accion==='solicitar-rev-adm'){
    validarBase();
    if(!tieneAlgunEnsayo) errores.push('• Debe tener al menos un ensayo cargado');
    // Verificar que todos los ensayos LEO tienen bonificación definida (campo bonifG o por fila)
    var hayPreciosIncompletos=rows.some(function(r){return !r.fueraLeo&&r.eid&&(!r.bonif&&r.bonif!==0)&&!doc.bonifG;});
    // Validación simplificada: el % de bonificación general debe estar seteado
    if(!doc.bonifG||Number(doc.bonifG)===0)
      errores.push('• El % de bonificación general debe ser mayor a 0');
  }

  // ── RPOC fuera de LEO: guardar borrador ──────────────────────────────────
  if(accion==='guardar-fuera-leo'){
    if(!doc.cliente||!doc.cliente.trim()) errores.push('• Razón social es obligatoria');
    if(!doc.validoHasta) errores.push('• Válido hasta es obligatorio');
    if(!tieneFueraLeo) errores.push('• Debe tener al menos un ensayo fuera de LEO');
    if(!doc.elaboro||!doc.elaboro.trim()) errores.push('• Debe seleccionar quién elaboró (sección Firmas)');
  }

  // ── RPOC fuera de LEO: Revisión Adm → Revisión SGI ──────────────────────
  if(accion==='aprobar-adm-a-sgi'){
    var sinPrecio=rows.filter(function(r){return r.fueraLeo;}).some(function(r){
      return !r.precioManual||r.precioManual===0;
    });
    if(sinPrecio) errores.push('• Todos los ensayos fuera de LEO deben tener precio cargado');
  }

  return errores;
}

function mostrarErrores(errores, titulo){
  if(!errores||!errores.length) return false;
  alert((titulo||'No se puede continuar')+'\n\n'+errores.join('\n'));
  return true;
}

async function saveDoc(){
  var tieneFueraLeo=(APP.form.rows||[]).some(function(r){return r.fueraLeo;});
  var eraRpoc=APP.form.tipo==='RPOC';

  // ── Determinar tipo PR / RPOC ──
  if(tieneFueraLeo||APP.form.solicitarRevAdm){
    APP.form.tipo='RPOC';
    if(!APP.form.numero||APP.form.numero.startsWith('PR')){
      APP.form.numero=nextRPOCNumero();
    }
  } else {
    APP.form.tipo='PR';
    if(!APP.form.numero||APP.form.numero.startsWith('RPOC')){
      APP.form.numero=nextPRNumero();
    }
  }

  // ── Estado al guardar ──
  var estadoActual=APP.form.estado||'borrador';
  var esAprobadoOEnviado=(estadoActual==='aprobado'||estadoActual==='enviado');

  if(APP.editId){
    // Solo generar nueva versión si el doc YA estaba aprobado/enviado
    var existing=APP.docs.find(function(d){return d.id===APP.editId;});
    if(existing&&(existing.estado==='aprobado'||existing.estado==='enviado')){
      var v=parseInt(APP.form.version||'0',10);
      APP.form.version=String(v+1);
      APP.form.estado='borrador';
      // Limpiar flags de revisión al iniciar nueva versión
      APP.form.solicitarRevAdm=false;
      APP.form.revAdminNombre='';APP.form.tsRevAdmin='';APP.form.revAdminNota='';
      APP.form.revCalidadNombre='';APP.form.tsRevCalidad='';APP.form.revCalidadNota='';
    } else {
      // En revisión o borrador: NO nueva versión, avanzar estado si corresponde
      if(APP.form.tipo==='RPOC'){
        // Solo avanzar estado si fue pedido explícitamente por un handler de acción
        // (enviar-revision, solicitar-rev-adm) — nunca al guardar borrador
        if(APP.form._pedirRevision){
          APP.form._pedirRevision=false;
          APP.form.revAdminNombre='';APP.form.tsRevAdmin='';APP.form.revAdminNota='';
          APP.form.estado='en_revision_adm';
        }
      }
    }
  } else {
    // Doc nuevo: si pidió revisión explícitamente, avanzar; sino queda en borrador
    if(APP.form.tipo==='RPOC'&&APP.form._pedirRevision){
      APP.form._pedirRevision=false;
      APP.form.revAdminNombre='';APP.form.tsRevAdmin='';APP.form.revAdminNota='';
      APP.form.estado='en_revision_adm';
    }
  }

  var doc=JSON.parse(JSON.stringify(APP.form));
  (doc.rows||[]).forEach(function(r){
    if(r.precioManual==null){
      r.precioCongelado=unitPriceNow(r,doc.tarifa||'leo');
    }
  });
  doc.updatedAt=new Date().toISOString();
  if(APP.editId){
    var existing=APP.docs.find(function(d){return d.id===APP.editId;});
    var esNuevaVersion=existing&&(existing.estado==='aprobado'||existing.estado==='enviado');
    if(esNuevaVersion){
      // Registrar en el historial de auditoría qué cambió respecto a la versión anterior
      var detallesCambio=diffVersiones(existing,doc);
      doc.cambios=(existing.cambios||[]).concat([{
        ts:new Date().toLocaleString('es-AR'),
        version:doc.version,
        versionAnterior:existing.version,
        autor:doc.elaboro||'—',
        detalles:detallesCambio.length?detallesCambio:['Sin cambios detectados en los campos monitoreados.']
      }]);
      // Conservar versión vieja como histórico (al final, en gris)
      var viejoHistorico=JSON.parse(JSON.stringify(existing));
      viejoHistorico.historico=true;
      viejoHistorico.id=existing.id+'_h'+Date.now();
      // Reemplazar el original con la nueva versión
      var idx=APP.docs.findIndex(function(d){return d.id===APP.editId;});
      if(idx>=0){APP.docs[idx]=doc;}else{APP.docs.push(doc);}
      // Agregar el histórico al final
      APP.docs.push(viejoHistorico);
    } else {
      var idx=APP.docs.findIndex(function(d){return d.id===APP.editId;});
      if(idx>=0){APP.docs[idx]=doc;}else{APP.docs.push(doc);}
    }
  } else {
    APP.docs.push(doc);
  }
  APP.editId=doc.id;
  APP.form=JSON.parse(JSON.stringify(doc));
  APP.ui.savedFlash=true;
  render();
  try{
    await saveDocRemote(doc);
  }catch(e){
    console.error('Error al guardar en SharePoint:', e);
    alert('No se pudo guardar en SharePoint. Verificá tu conexión y volvé a intentar. Los cambios quedaron solo en esta sesión.');
  }
  setTimeout(function(){APP.ui.savedFlash=false;APP.view='list';render();},1200);
}

        scale:2,
        useCORS:true,
        backgroundColor:'#ffffff',
        width:794,

        var y=0;
        while(y<imgH){
          if(y>0)pdf.addPage();
          var corte=Math.min(y+pdfH,imgH);
          if(corte<imgH){
            for(var i=0;i<bloques.length;i++){
              var bTop=bloques[i].top*pxToMm, bBot=bloques[i].bottom*pxToMm;
              if(bTop<corte&&bBot>corte&&bTop>y){corte=bTop;}
            }
            if(corte<=y)corte=Math.min(y+pdfH,imgH); // salvaguarda anti-loop
          }
          pdf.addImage(imgData,'JPEG',0,-y,pdfW,imgH);
          y=corte;
        }
        pdf.save(nombre);

      });
    }catch(e){

function nextRPOCNumero(){
  var hoy=new Date().toISOString().slice(0,10);
  // El consecutivo es GLOBAL (nunca se reinicia, ni por día ni por año)
  var max=0;
  APP.docs.forEach(function(d){
    if(d.tipo!=='RPOC'||!d.numero)return;
    var m=d.numero.match(/^RPOC \d{4}-\d{2}-\d{2}-(\d+)/);
    if(m){var n=parseInt(m[1],10);if(n>max)max=n;}
  });
  return 'RPOC '+hoy+'-'+String(max+1).padStart(4,'0');
}

    var header='',list='',footer='';

    // ── PASO 1: Clasificación ────────────────────────────────────────────────
    if(PASO==='cls'){
      header='＋ Ensayo fuera de LEO — Clasificación';
      list='<div>'
        +BIB_FUERA_LEO.map(function(c){
          var totalEns=c.mats.reduce(function(a,m){
            return a+m.grps.reduce(function(b,g){return b+g.ens.length;},0);
          },0);
          var selEnCls=selFuera.filter(function(s){return c.mats.some(function(m){return m.m===s.mat;});}).length;
          return '<div class="modal-mat-item fl-cls-item" data-cls="'+encodeURIComponent(c.cls)+'" style="padding:9px 16px;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:'+(selEnCls?'#f0fdf4':'#fff')+'">'
            +'<span style="font-size:11px;font-weight:500;color:#1d3557;pointer-events:none;">'+c.cls+(selEnCls?'<span style="font-size:9px;color:#16a34a;margin-left:6px;pointer-events:none;">✓ '+selEnCls+'</span>':'')+'</span>'
            +'<span style="font-size:10px;color:#9ca3af;pointer-events:none;">'+c.mats.length+' mat · '+totalEns+' ens <span style="color:#42A9B8;font-weight:600;">›</span></span>'
            +'</div>';
        }).join('')+'</div>';
      footer=footerBase('');
    }

    // ── PASO 2: Matriz ────────────────────────────────────────────────────────
    else if(PASO==='mat'){
      var clsObj=BIB_FUERA_LEO.find(function(c){return c.cls===selCls;})||{mats:[]};
      header='← <span style="font-size:12px;">'+selCls+'</span>';
      var qv=document.getElementById('fl-q')?document.getElementById('fl-q').value:'';
      var mats=clsObj.mats.filter(function(m){return !qv||m.m.toLowerCase().includes(qv.toLowerCase());}).slice().sort(function(a,b){return a.m.localeCompare(b.m,'es');});
      list='<div style="padding:8px 14px 4px;"><input id="fl-q" type="search" placeholder="Filtrar matrices..." class="f" style="width:100%;font-size:11px;" value="'+qv+'"></div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr;">'
        +mats.map(function(m){
          var cnt=m.grps.reduce(function(a,g){return a+g.ens.length;},0);
          var selEnEsta=selFuera.filter(function(s){return s.mat===m.m;}).length;
          return '<div class="modal-mat-item fl-mat-item" data-mat="'+encodeURIComponent(m.m)+'" style="padding:9px 14px;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:'+(selEnEsta?'#f0fdf4':'#fff')+'">'
            +'<span style="font-size:11px;pointer-events:none;">'+m.m+(selEnEsta?'<span style="font-size:9px;color:#16a34a;margin-left:4px;pointer-events:none;">✓ '+selEnEsta+'</span>':'')+'</span>'
            +'<span style="font-size:10px;color:#42A9B8;font-weight:600;pointer-events:none;">'+cnt+' ›</span>'
            +'</div>';
        }).join('')+'</div>';
      footer=footerBase('Clasificación');
    }

    // ── PASO 3: Grupo de ensayo ───────────────────────────────────────────────
    else if(PASO==='grp'){
      var clsObj=BIB_FUERA_LEO.find(function(c){return c.cls===selCls;})||{mats:[]};
      var matObj=clsObj.mats.find(function(m){return m.m===selMat;})||{grps:[]};
      header='<span style="font-size:11px;color:rgba(255,255,255,.7);">'+selCls+' › </span><span style="font-size:12px;">'+selMat+'</span>';
      var grpsOrdenados=(matObj.grps||[]).slice().sort(function(a,b){return a.g.localeCompare(b.g,'es');});
      list='<div>'
        +grpsOrdenados.map(function(g){
          var selEnGrp=selFuera.filter(function(s){return s.mat===selMat&&g.ens.some(function(en){return en.e===s.ens;});}).length;
          return '<div class="modal-mat-item fl-grp-item" data-grp="'+encodeURIComponent(g.g)+'" style="padding:10px 16px;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:'+(selEnGrp?'#f0fdf4':'#fff')+'">'
            +'<span style="font-size:11px;font-weight:500;color:#1d3557;pointer-events:none;">'+g.g+(selEnGrp?'<span style="font-size:9px;color:#16a34a;margin-left:4px;pointer-events:none;">✓ '+selEnGrp+'</span>':'')+'</span>'
            +'<span style="font-size:10px;color:#42A9B8;font-weight:600;pointer-events:none;">'+g.ens.length+' ›</span>'
            +'</div>';
        }).join('')+'</div>';
      footer=footerBase('← Matriz');
    }

    // ── PASO 4: Ensayos — clic para toggle verde (igual que LEO) ────────────
    else if(PASO==='ens'){
      var clsObj=BIB_FUERA_LEO.find(function(c){return c.cls===selCls;})||{mats:[]};
      var matObj=clsObj.mats.find(function(m){return m.m===selMat;})||{grps:[]};
      var grpObj=matObj.grps.find(function(g){return g.g===selGrp;})||{ens:[]};
      header='<span style="font-size:11px;color:rgba(255,255,255,.7);">'+selMat+' › </span><span style="font-size:12px;">'+selGrp+'</span>';
      list=(grpObj.ens||[]).slice().sort(function(a,b){return a.e.localeCompare(b.e,'es');}).map(function(en){
        var ya=isSel(selMat,en.e);
        var nombreConDerivante=en.e;
        return '<div class="modal-mat-item fl-ens-item'+(ya?' modal-ya-sel':'')+'" data-ens-e="'+encodeURIComponent(en.e)+'" data-ens-t="'+encodeURIComponent(en.t)+'" data-ens-p="'+(en.p!=null?en.p:'')+'" data-ens-d="'+encodeURIComponent(en.d||'')+'" style="padding:9px 16px;border-bottom:1px solid #f3f4f6;cursor:pointer;background:'+(ya?'#f0fdf4':'#fff')+'">'
          +'<div style="font-size:11px;font-weight:500;color:#111827;pointer-events:none;">'+nombreConDerivante+(ya?'<span class="modal-ya-badge"> ✓ seleccionado — clic para quitar</span>':'')+'</div>'
          +'<div style="font-size:10px;color:#6b7280;margin-top:1px;pointer-events:none;">'+en.t+'</div>'
          +'</div>';
      }).join('');
      footer=footerBase('← Grupo');
    }

    // ── PASO: Formulario manual compacto ─────────────────────────────────────
    else if(PASO==='form'){
      header='✎ Ingresar ensayo manualmente';
      list='<div style="padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:6px;">'
        +'<div style="grid-column:1/-1;"><label style="font-size:10px;color:#6b7280;display:block;margin-bottom:2px;">Matriz</label><input id="fl-mat" class="f" style="width:100%;font-size:11px;" placeholder="Ej: Harina de soja" value="'+(selMat||'')+'"></div>'
        +'<div style="grid-column:1/-1;"><label style="font-size:10px;color:#6b7280;display:block;margin-bottom:2px;">Ensayo</label><input id="fl-ens-n" class="f" style="width:100%;font-size:11px;" placeholder="Nombre del ensayo"></div>'
        +'<div style="grid-column:1/-1;"><label style="font-size:10px;color:#6b7280;display:block;margin-bottom:2px;">Técnica</label><input id="fl-tec" class="f" style="width:100%;font-size:11px;" placeholder="Técnica analítica"></div>'
        +'<div style="grid-column:1/-1;"><label style="font-size:10px;color:#6b7280;display:block;margin-bottom:2px;">Laboratorio derivante (opcional)</label><input id="fl-derivante" class="f" style="width:100%;font-size:11px;" placeholder="Ej: Nofalab"></div>'
        +'<div><label style="font-size:10px;color:#6b7280;display:block;margin-bottom:2px;">Cant.</label><input id="fl-cant" class="f" type="number" min="1" value="1" style="width:100%;font-size:11px;"></div>'
        +'<div><label style="font-size:10px;color:#6b7280;display:block;margin-bottom:2px;">Bonif. %</label><input id="fl-bon" class="f" type="number" min="0" max="100" value="0" style="width:100%;font-size:11px;"></div>'
        +'<div style="grid-column:1/-1;"><label style="font-size:10px;color:#f59e0b;font-weight:600;display:block;margin-bottom:2px;">⚠ Precio unitario</label><input id="fl-precio" class="f" type="number" min="0" value="0" style="width:100%;font-size:11px;border-color:#fbbf24;background:#fffbeb;"></div>'
        +'<div style="grid-column:1/-1;"><label style="font-size:10px;color:#6b7280;display:block;margin-bottom:2px;">Muestra mínima</label><input id="fl-mues" class="f" style="width:100%;font-size:11px;" placeholder="Ej: 500 g"></div>'
        +'</div>';
      footer='<button class="fl-cancel" style="padding:6px 14px;border:1px solid #d1d5db;border-radius:4px;background:#fff;cursor:pointer;font-size:11px;">Cancelar</button>'
        +'<button class="fl-back" style="padding:6px 14px;border:1px solid #6b7280;border-radius:4px;background:#fff;color:#6b7280;cursor:pointer;font-size:11px;margin-left:6px;">← Volver</button>'
        +'<button class="fl-confirm" style="padding:6px 16px;border:none;border-radius:4px;background:#1d3557;color:#fff;cursor:pointer;font-size:11px;font-weight:600;margin-left:6px;">Agregar ensayo</button>';
    }

    // Renderizar modal box
    var box=ov.querySelector('.modal-box')||document.createElement('div');
    box.className='modal-box';
    box.innerHTML='<div style="background:#1d3557;color:#fff;padding:10px 14px;display:flex;align-items:center;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;">'+header+'</div>'
      +'<div style="max-height:380px;overflow-y:auto;">'+list+'</div>'
      +'<div style="padding:8px 12px;display:flex;justify-content:flex-end;border-top:1px solid #e5e7eb;gap:6px;background:#f9fafb;border-radius:0 0 8px 8px;">'+footer+'</div>';
    if(!ov.contains(box))ov.appendChild(box);

    var qEl=document.getElementById('fl-q');
    if(qEl){qEl.addEventListener('input',function(){renderModal();});setTimeout(function(){if(qEl)qEl.focus();},50);}
  }

  // ── Delegación de clicks ──────────────────────────────────────────────────
  ov.addEventListener('click',function(e){
    var t=e.target;

    if(t.closest('.fl-cancel')){ov.remove();return;}

    if(t.closest('.fl-back')){
      if(PASO==='mat'){PASO='cls';}
      else if(PASO==='grp'){PASO='mat';}
      else if(PASO==='ens'){PASO='grp';}
      else if(PASO==='form'){PASO=selGrp?'ens':(selMat?'grp':(selCls?'mat':'cls'));}
      else{PASO='cls';}
      renderModal();return;
    }

    if(t.closest('.fl-manual')){PASO='form';renderModal();return;}

    // Agregar todos los seleccionados (igual que mconfirm en LEO)
    if(t.closest('.fl-agregar')){
      selFuera.forEach(function(s){
        var r=mkRow();
        r.mat1=s.mat;r.matriz=s.mat;
        r.nombreLibre=s.ens;r.tec=s.tec;r.cant=1;
        r.muestraLibre='';r.bonif=0;r.precioManual=(s.precio!=null&&!isNaN(s.precio))?s.precio:0;
        r.fueraLeo=true;r.esDeriv=false;r.eid=null;
        APP.form.rows.push(r);
      });
      render();
      ov.remove();
      return;
    }

    // Clasificación
    var clsItem=t.closest('.fl-cls-item');
    if(clsItem){selCls=decodeURIComponent(clsItem.dataset.cls);PASO='mat';q='';renderModal();return;}

    // Matriz
    var matItem=t.closest('.fl-mat-item');
    if(matItem){selMat=decodeURIComponent(matItem.dataset.mat);PASO='grp';renderModal();return;}

    // Grupo
    var grpItem=t.closest('.fl-grp-item');
    if(grpItem){selGrp=decodeURIComponent(grpItem.dataset.grp);PASO='ens';renderModal();return;}

    // Ensayo — toggle selección (verde/sin verde, igual que LEO)
    var ensItem=t.closest('.fl-ens-item');
    if(ensItem){
      var ens=decodeURIComponent(ensItem.dataset.ensE);
      var tec=decodeURIComponent(ensItem.dataset.ensT);
      var precioSel=ensItem.dataset.ensP?parseFloat(ensItem.dataset.ensP):null;
      var derivanteSel=ensItem.dataset.ensD?decodeURIComponent(ensItem.dataset.ensD):'';
      toggleSel(selMat,ens,tec,precioSel,derivanteSel);
      renderModal();return;
    }

    // Formulario manual
    if(t.closest('.fl-confirm')){
      var mat=document.getElementById('fl-mat').value.trim();
      var ensN=document.getElementById('fl-ens-n').value.trim();
      var tec=document.getElementById('fl-tec').value.trim();
      var derivManual=document.getElementById('fl-derivante').value.trim();
      var cant=parseInt(document.getElementById('fl-cant').value)||1;
      var mues=document.getElementById('fl-mues').value.trim();
      var bon=parseInt(document.getElementById('fl-bon').value)||0;
      var precio=parseFloat(document.getElementById('fl-precio').value)||0;
      if(!mat||!ensN){alert('Completá al menos Matriz y Ensayo.');return;}
      var r=mkRow();
      r.mat1=mat;r.matriz=mat;
      r.nombreLibre=ensN;r.tec=tec;r.cant=cant;
      r.muestraLibre=mues;r.bonif=bon;r.precioManual=precio;
      r.fueraLeo=true;r.esDeriv=false;r.eid=null;
      APP.form.rows.push(r);
      agregarEnsayoFueraLeoSiNoExiste(mat,ensN,tec,derivManual);
      render();
      ov.remove();
      return;
    }
  });

  renderModal();
}



function renderKPI(){
  var docs=APP.docs.slice(); // incluye históricos para el dashboard

  // ── Filtros ───────────────────────────────────────────────────────────────
  var kf=APP.kpiFilters=APP.kpiFilters||{campania:'actual',tipo:'todos',elaboro:'todos'};

  // Año fiscal: 1/8 al 31/7
  var hoy=new Date();
  var añoFiscalActual=hoy.getMonth()>=7?hoy.getFullYear():hoy.getFullYear()-1;
  function getCampaniaRange(año){
    return {desde:año+'-08-01',hasta:(año+1)+'-07-31',label:'Campaña '+(año)+'/'+(año+1)};
  }
  var campanias=[
    getCampaniaRange(añoFiscalActual),
    getCampaniaRange(añoFiscalActual-1),
    getCampaniaRange(añoFiscalActual-2),
  ];
  var camp=kf.campania==='actual'?campanias[0]:campanias.find(function(c){return c.label===kf.campania;})||campanias[0];

  // Filtrar docs por campaña y tipo
  var filtered=docs.filter(function(d){
    var docFecha=d.fecha||(d.createdAt?d.createdAt.slice(0,10):'');
    if(!docFecha||docFecha<camp.desde||docFecha>camp.hasta)return false;
    if(kf.tipo!=='todos'&&d.tipo!==kf.tipo)return false;
    if(kf.elaboro!=='todos'&&d.elaboro!==kf.elaboro)return false;
    return true;
  });

  // ── Calcular métricas ────────────────────────────────────────────────────
  var total=filtered.length;
  var pr=filtered.filter(function(d){return d.tipo==='PR';}).length;
  var rpoc=filtered.filter(function(d){return d.tipo==='RPOC';}).length;
  var enviados=filtered.filter(function(d){return d.estado==='enviado';}).length;
  var finalizados=filtered.filter(function(d){return d.estado==='finalizado'||d.estado==='aprobado';}).length;
  var rechazados=filtered.filter(function(d){return d.estado==='rechazado';}).length;
  var enRevision=filtered.filter(function(d){return d.estado==='en_revision_adm'||d.estado==='en_revision_sgi';}).length;
  var borradores=filtered.filter(function(d){return d.estado==='borrador';}).length;

  var valorTotal=filtered.reduce(function(a,d){return a+docTotal(d);},0);
  var valorEnviado=filtered.filter(function(d){return d.estado==='enviado';}).reduce(function(a,d){return a+docTotal(d);},0);
  var valorCartera=filtered.filter(function(d){return ['finalizado','aprobado','en_revision_adm','en_revision_sgi'].includes(d.estado);}).reduce(function(a,d){return a+docTotal(d);},0);

  // Tasa de respuesta (finalizados+enviados / total)
  var tasaRespuesta=total>0?Math.round((finalizados+enviados)/total*100):0;

  // Tiempo promedio de borrador a finalizado (días)
  var tiempos=filtered.filter(function(d){
    return (d.estado==='finalizado'||d.estado==='enviado')&&d.createdAt&&d.updatedAt;
  }).map(function(d){
    return (new Date(d.updatedAt)-new Date(d.createdAt))/(1000*60*60*24);
  });
  var tiempoPromedio=tiempos.length?Math.round(tiempos.reduce(function(a,b){return a+b;},0)/tiempos.length):null;

  // Top clientes por valor
  var porCliente={};
  filtered.forEach(function(d){
    var c=d.cliente||'(sin cliente)';
    if(!porCliente[c])porCliente[c]={cant:0,valor:0,enviados:0};
    porCliente[c].cant++;
    porCliente[c].valor+=docTotal(d);
    if(d.estado==='enviado')porCliente[c].enviados++;
  });
  var topClientes=Object.entries(porCliente).sort(function(a,b){return b[1].valor-a[1].valor;}).slice(0,8);
  var topClientesCant=Object.entries(porCliente).sort(function(a,b){return b[1].cant-a[1].cant;}).slice(0,8);

  // Evolución mensual
  var meses={};
  filtered.forEach(function(d){
    var docF=d.fecha||(d.createdAt?d.createdAt.slice(0,10):'');
    if(!docF)return;
    var m=docF.slice(0,7); // YYYY-MM
    if(!meses[m])meses[m]={cant:0,valor:0,enviados:0};
    meses[m].cant++;
    meses[m].valor+=docTotal(d);
    if(d.estado==='enviado')meses[m].enviados++;
  });
  var mesesArr=Object.entries(meses).sort(function(a,b){return a[0].localeCompare(b[0]);});

  // Ensayos fuera de LEO más solicitados (se excluyen los RPOC importados masivamente)
  var ensayosFuera={};
  filtered.filter(function(d){return !d.archivoOrigen;}).forEach(function(d){
    (d.rows||[]).filter(function(r){return r.fueraLeo;}).forEach(function(r){
      var k=r.nombreLibre||'?';
      if(!ensayosFuera[k])ensayosFuera[k]={cant:0,valor:0,matrices:new Set()};
      ensayosFuera[k].cant++;
      ensayosFuera[k].valor+=(r.precioManual||0)*r.cant*(1-(r.bonif||0)/100);
      ensayosFuera[k].matrices.add(r.mat1||'?');
    });
  });
  var topEnsayos=Object.entries(ensayosFuera).sort(function(a,b){return b[1].cant-a[1].cant;}).slice(0,10);

  // Elaboradores únicos para filtro
  var elaboradores=(APP.elaboradores||[]).slice().sort(function(a,b){return a.localeCompare(b,'es');});

  // ── Helpers SVG ──────────────────────────────────────────────────────────
  var maxVal=Math.max.apply(null,mesesArr.map(function(m){return m[1].valor;})||[1]);
  var maxCant=Math.max.apply(null,mesesArr.map(function(m){return m[1].cant;})||[1]);
  var BAR_W=mesesArr.length>0?Math.floor(520/mesesArr.length)-4:40;
  var barChartValor=mesesArr.length===0?'<p style="color:#9ca3af;font-size:11px;text-align:center;padding:20px;">Sin datos para el período</p>':
    '<svg width="100%" viewBox="0 '+(-(80))+' '+(mesesArr.length*(BAR_W+4)+20)+' 200" style="overflow:visible;">'
    +mesesArr.map(function(m,i){
      var h=maxVal>0?Math.round((m[1].valor/maxVal)*120):0;
      var hE=maxVal>0?Math.round((m[1].enviados?filtered.filter(function(d){return d.estado==='enviado'&&d.fecha&&d.fecha.slice(0,7)===m[0];}).reduce(function(a,d){return a+docTotal(d);},0):0)/maxVal*120):0;
      var x=i*(BAR_W+4)+10;
      var mes=m[0].slice(5);
      var label=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][parseInt(mes)-1];
      return '<rect x="'+x+'" y="'+(120-h)+'" width="'+BAR_W+'" height="'+h+'" fill="#42A9B8" opacity="0.3" rx="2"/>'+
             '<rect x="'+x+'" y="'+(120-hE)+'" width="'+BAR_W+'" height="'+hE+'" fill="#42A9B8" rx="2"/>'+
             '<text x="'+(x+BAR_W/2)+'" y="135" text-anchor="middle" font-size="9" fill="#6b7280">'+label+'</text>'+
             '<text x="'+(x+BAR_W/2)+'" y="'+(120-h-4)+'" text-anchor="middle" font-size="8" fill="#1d3557">'+m[1].cant+'</text>';
    }).join('')+'</svg>';

  // Donut chart estados
  var estados=[
    {l:'Enviados',v:enviados,c:'#42A9B8'},
    {l:'Finalizados',v:finalizados,c:'#34d399'},
    {l:'En revisión',v:enRevision,c:'#fbbf24'},
    {l:'Borradores',v:borradores,c:'#d1d5db'},
    {l:'Rechazados',v:rechazados,c:'#f87171'},
  ];
  var totalEstados=estados.reduce(function(a,e){return a+e.v;},0)||1;
  var donutHtml='';
  var offset=0;
  var r=40,cx=60,cy=55,circum=2*Math.PI*r;
  estados.forEach(function(e){
    if(!e.v)return;
    var dash=(e.v/totalEstados)*circum;
    donutHtml+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+e.c+'" stroke-width="18" stroke-dasharray="'+dash+' '+(circum-dash)+'" stroke-dashoffset="'+(-offset*circum/totalEstados)+'" transform="rotate(-90 '+cx+' '+cy+')" />';
    offset+=e.v;
  });
  var donutSVG='<svg width="120" height="110">'
    +donutHtml
    +'<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="18" font-weight="700" fill="#1d3557">'+total+'</text>'
    +'<text x="'+cx+'" y="'+(cy+8)+'" text-anchor="middle" font-size="9" fill="#6b7280">docs</text>'
    +'</svg>';

  // Barra horizontal clientes
  var maxClienteVal=topClientes.length>0?topClientes[0][1].valor:1;
  var clientesBars=topClientes.map(function(c){
    var pct=maxClienteVal>0?Math.round(c[1].valor/maxClienteVal*100):0;
    var nombre=c[0].length>22?c[0].slice(0,22)+'…':c[0];
    return '<div style="margin-bottom:8px;">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:2px;">'
      +'<span style="font-size:10px;color:#1d3557;font-weight:500;">'+nombre+'</span>'
      +'<span style="font-size:10px;color:#6b7280;">'+fmtC(c[1].valor)+'</span>'
      +'</div>'
      +'<div style="background:#f3f4f6;border-radius:4px;height:8px;">'
      +'<div style="background:linear-gradient(90deg,#1d3557,#42A9B8);border-radius:4px;height:8px;width:'+pct+'%;transition:width .5s;"></div>'
      +'</div>'
      +'<div style="font-size:9px;color:#9ca3af;margin-top:1px;">'+c[1].cant+' presupuesto'+(c[1].cant!==1?'s':'')+(c[1].enviados?' · '+c[1].enviados+' enviado'+(c[1].enviados!==1?'s':''):'')+'</div>'
      +'</div>';
  }).join('');

  var maxClienteCant=topClientesCant.length>0?topClientesCant[0][1].cant:1;
  var clientesBarsCant=topClientesCant.map(function(c){
    var pct=maxClienteCant>0?Math.round(c[1].cant/maxClienteCant*100):0;
    var nombre=c[0].length>22?c[0].slice(0,22)+'…':c[0];
    return '<div style="margin-bottom:8px;">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:2px;">'
      +'<span style="font-size:10px;color:#1d3557;font-weight:500;">'+nombre+'</span>'
      +'<span style="font-size:10px;color:#6b7280;">'+c[1].cant+' PR/RPOC</span>'
      +'</div>'
      +'<div style="background:#f3f4f6;border-radius:4px;height:8px;">'
      +'<div style="background:linear-gradient(90deg,#1d3557,#42A9B8);border-radius:4px;height:8px;width:'+pct+'%;transition:width .5s;"></div>'
      +'</div>'
      +'<div style="font-size:9px;color:#9ca3af;margin-top:1px;">'+fmtC(c[1].valor)+(c[1].enviados?' · '+c[1].enviados+' enviado'+(c[1].enviados!==1?'s':''):'')+'</div>'
      +'</div>';
  }).join('');

  // Campañas selector options
  var campOpts=campanias.map(function(c){
    return '<option value="'+c.label+'"'+(camp.label===c.label?' selected':'')+'>'+c.label+'</option>';
  }).join('');

  return `
  <div style="background:#f9fafb;min-height:100vh;">
    <!-- Header -->
    <div class="topbar" style="margin-bottom:0;">
      <div class="topbar-logo">
        <div class="topbar-logo-left">
          <span class="logo-bcr">BCR</span><span class="logo-labs">labs</span>
        </div>
        <div style="text-align:center;">
          <div style="font-size:13px;font-weight:700;color:#fff;">PRESUPUESTO</div>
          <div style="font-size:11px;color:rgba(255,255,255,.8);">DASHBOARD COMERCIAL</div>
        </div>
        <div style="font-size:9px;color:rgba(255,255,255,.5);">LFORM.0250 V13</div>
      </div>
      <div class="tb-toolbar" style="padding:6px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button onclick="APP.view='list';render();" class="tb-btn" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);">← Volver al listado</button>
        <select onchange="APP.kpiFilters.campania=this.value==='${campanias[0].label}'?'actual':this.value;render();" style="font-size:11px;padding:4px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.4);background:#fff;color:#1d3557;">
          ${campOpts}
        </select>
        <select onchange="APP.kpiFilters.tipo=this.value;render();" style="font-size:11px;padding:4px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.4);background:#fff;color:#1d3557;">
          <option value="todos"${kf.tipo==='todos'?' selected':''}>PR y RPOC</option>
          <option value="PR"${kf.tipo==='PR'?' selected':''}>Solo PR</option>
          <option value="RPOC"${kf.tipo==='RPOC'?' selected':''}>Solo RPOC</option>
        </select>
        <select onchange="APP.kpiFilters.elaboro=this.value;render();" style="font-size:11px;padding:4px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.4);background:#fff;color:#1d3557;">
          <option value="todos">Todos los responsables</option>
          ${elaboradores.map(function(e){return '<option value="'+e+'"'+(kf.elaboro===e?' selected':'')+'>'+e+'</option>';}).join('')}
        </select>
        <span style="font-size:10px;color:rgba(255,255,255,.6);">${camp.label} · ${camp.desde} → ${camp.hasta}</span>
      </div>
    </div>

    <div style="padding:16px;max-width:1200px;margin:0 auto;">

      <!-- BLOQUE 1: KPIs principales -->
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;">
        ${[
          {l:'Total docs',v:total,c:'#1d3557',s:''},
          {l:'PR',v:pr,c:'#3b82f6',s:'de '+total},
          {l:'RPOC',v:rpoc,c:'#8b5cf6',s:'de '+total},
          {l:'Tasa de respuesta',v:tasaRespuesta+'%',c:tasaRespuesta>=70?'#16a34a':tasaRespuesta>=40?'#f59e0b':'#dc2626',s:(finalizados+enviados)+' de '+total+' respondidos'},
          {l:'Tiempo prom. respuesta',v:tiempoPromedio!==null?tiempoPromedio+'d':'—',c:'#42A9B8',s:tiempoPromedio!==null?'días hábiles aprox.':'sin datos'},
        ].map(function(k){
          return '<div style="background:#fff;border-radius:8px;padding:12px 14px;border:0.5px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04);">'
            +'<div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">'+k.l+'</div>'
            +'<div style="font-size:28px;font-weight:700;color:'+k.c+';line-height:1;">'+k.v+'</div>'
            +(k.s?'<div style="font-size:9px;color:#9ca3af;margin-top:4px;">'+k.s+'</div>':'')
            +'</div>';
        }).join('')}
      </div>

      <!-- BLOQUE 1b: Valores -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;">
        ${[
          {l:'Valor total presupuestado',v:fmtC(valorTotal),c:'#1d3557',s:'suma de todos los docs del período'},
          {l:'Valor enviado al cliente',v:fmtC(valorEnviado),c:'#42A9B8',s:'presupuestos ya enviados'},
          {l:'Valor en cartera',v:fmtC(valorCartera),c:'#f59e0b',s:'en proceso de aprobación'},
        ].map(function(k){
          return '<div style="background:#fff;border-radius:8px;padding:12px 16px;border:0.5px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;align-items:center;gap:14px;">'
            +'<div style="font-size:32px;font-weight:700;color:'+k.c+';">$</div>'
            +'<div>'
            +'<div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;">'+k.l+'</div>'
            +'<div style="font-size:20px;font-weight:700;color:'+k.c+';">'+k.v+'</div>'
            +'<div style="font-size:9px;color:#9ca3af;">'+k.s+'</div>'
            +'</div></div>';
        }).join('')}
      </div>

      <!-- BLOQUE 2 y 3: Embudo + Evolución -->
      <div style="display:grid;grid-template-columns:200px 1fr;gap:10px;margin-bottom:16px;">

        <!-- Donut estados -->
        <div style="background:#fff;border-radius:8px;padding:14px;border:0.5px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04);">
          <div style="font-size:11px;font-weight:600;color:#1d3557;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;">Distribución</div>
          <div style="display:flex;flex-direction:column;align-items:center;">
            ${donutSVG}
            <div style="margin-top:6px;width:100%;">
              ${estados.filter(function(e){return e.v>0;}).map(function(e){
                return '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">'
                  +'<div style="width:10px;height:10px;border-radius:50%;background:'+e.c+';flex-shrink:0;"></div>'
                  +'<span style="font-size:10px;color:#374151;flex:1;">'+e.l+'</span>'
                  +'<span style="font-size:10px;font-weight:600;color:#1d3557;">'+e.v+'</span>'
                  +'</div>';
              }).join('')}
            </div>
          </div>
        </div>

        <!-- Evolución mensual -->
        <div style="background:#fff;border-radius:8px;padding:14px;border:0.5px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div style="font-size:11px;font-weight:600;color:#1d3557;text-transform:uppercase;letter-spacing:.05em;">Evolución mensual — ${camp.label}</div>
            <div style="display:flex;gap:10px;font-size:9px;color:#6b7280;">
              <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#42A9B8;opacity:.3;vertical-align:middle;"></span> Total</span>
              <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#42A9B8;vertical-align:middle;"></span> Enviados</span>
            </div>
          </div>
          <div style="font-size:9px;color:#9ca3af;margin-bottom:2px;">Eje X: mes &nbsp;·&nbsp; Eje Y: valor presupuestado ($) &nbsp;·&nbsp; número sobre la barra: cantidad de PR/RPOC ese mes</div>
          <div style="overflow-x:auto;">${barChartValor}</div>
        </div>
      </div>

      <!-- BLOQUE 4: Clientes + Ensayos fuera de LEO -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;">

        <!-- Top clientes por valor -->
        <div style="background:#fff;border-radius:8px;padding:14px;border:0.5px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04);">
          <div style="font-size:11px;font-weight:600;color:#1d3557;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;">Top clientes por valor presupuestado</div>
          ${topClientes.length?clientesBars:'<p style="color:#9ca3af;font-size:11px;text-align:center;padding:20px;">Sin datos</p>'}
        </div>

        <!-- Top clientes por cantidad de PR/RPOC -->
        <div style="background:#fff;border-radius:8px;padding:14px;border:0.5px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04);">
          <div style="font-size:11px;font-weight:600;color:#1d3557;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;">Top clientes por cantidad de PR/RPOC</div>
          ${topClientesCant.length?clientesBarsCant:'<p style="color:#9ca3af;font-size:11px;text-align:center;padding:20px;">Sin datos</p>'}
        </div>

        <!-- Ensayos fuera de LEO -->
        <div style="background:#fff;border-radius:8px;padding:14px;border:0.5px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04);">
          <div style="font-size:11px;font-weight:600;color:#1d3557;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Ensayos fuera de LEO — candidatos a incorporar</div>
          <div style="font-size:9px;color:#9ca3af;margin-bottom:10px;">Ordenados por frecuencia de solicitud</div>
          ${topEnsayos.length?
            '<table style="width:100%;border-collapse:collapse;font-size:11px;">'
            +'<thead><tr style="background:#f9fafb;">'
            +'<th style="padding:5px 6px;text-align:left;font-size:9px;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;">#</th>'
            +'<th style="padding:5px 6px;text-align:left;font-size:9px;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;">Ensayo</th>'
            +'<th style="padding:5px 6px;text-align:center;font-size:9px;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;">Veces</th>'
            +'<th style="padding:5px 6px;text-align:right;font-size:9px;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb;">Valor total</th>'
            +'</tr></thead><tbody>'
            +topEnsayos.map(function(e,i){
              return '<tr style="border-bottom:0.5px solid #f3f4f6;">'
                +'<td style="padding:5px 6px;color:#9ca3af;font-size:10px;">'+(i+1)+'</td>'
                +'<td style="padding:5px 6px;">'
                +'<div style="font-size:10px;font-weight:500;color:#1d3557;">'+e[0]+'</div>'
                +'<div style="font-size:9px;color:#9ca3af;">'+(e[1].matrices?e[1].matrices.size:0)+' matriz/matrices</div>'
                +'</td>'
                +'<td style="padding:5px 6px;text-align:center;">'
                +'<span style="font-size:13px;font-weight:700;color:'+(i<3?'#dc2626':'#6b7280')+';">'+e[1].cant+'</span>'
                +'</td>'
                +'<td style="padding:5px 6px;text-align:right;font-size:10px;color:#f59e0b;font-weight:600;">'+fmtC(e[1].valor)+'</td>'
                +'</tr>';
            }).join('')+'</tbody></table>'
            :'<p style="color:#9ca3af;font-size:11px;text-align:center;padding:20px;">Sin ensayos fuera de LEO en el período</p>'}
        </div>
      </div>

      <!-- BLOQUE 5: Actividad por responsable -->
      <div style="background:#fff;border-radius:8px;padding:14px;border:0.5px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px;">
        <div style="font-size:11px;font-weight:600;color:#1d3557;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;">Actividad por responsable</div>
        ${(function(){
          var porResp={};
          filtered.forEach(function(d){
            var r=d.elaboro||'(sin asignar)';
            if(!porResp[r])porResp[r]={total:0,enviados:0,rpoc:0,valor:0};
            porResp[r].total++;
            if(d.estado==='enviado')porResp[r].enviados++;
            if(d.tipo==='RPOC')porResp[r].rpoc++;
            porResp[r].valor+=docTotal(d);
          });
          var arr=Object.entries(porResp).sort(function(a,b){return b[1].total-a[1].total;});
          if(!arr.length)return '<p style="color:#9ca3af;font-size:11px;text-align:center;padding:10px;">Sin datos</p>';
          var maxT=arr[0][1].total||1;
          return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;">'
            +arr.map(function(r){
              var pct=Math.round(r[1].total/maxT*100);
              var tasaR=r[1].total?Math.round(r[1].enviados/r[1].total*100):0;
              return '<div style="border:0.5px solid #e5e7eb;border-radius:6px;padding:10px;">'
                +'<div style="font-size:11px;font-weight:600;color:#1d3557;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+r[0]+'</div>'
                +'<div style="font-size:20px;font-weight:700;color:#1d3557;">'+r[1].total+' <span style="font-size:11px;font-weight:400;color:#6b7280;">docs</span></div>'
                +'<div style="background:#f3f4f6;border-radius:4px;height:6px;margin:6px 0;">'
                +'<div style="background:#42A9B8;border-radius:4px;height:6px;width:'+pct+'%;"></div>'
                +'</div>'
                +'<div style="font-size:9px;color:#6b7280;">'+r[1].enviados+' enviados · '+tasaR+'% respuesta</div>'
                +'<div style="font-size:9px;color:#8b5cf6;margin-top:2px;">'+r[1].rpoc+' RPOC</div>'
                +'<div style="font-size:10px;color:#f59e0b;font-weight:600;margin-top:4px;">'+fmtC(r[1].valor)+'</div>'
                +'</div>';
            }).join('')+'</div>';
        })()}
      </div>

      <div style="text-align:center;font-size:9px;color:#d1d5db;padding-bottom:20px;">
        Dashboard generado con datos de localStorage · ${camp.label} · Actualizado: ${new Date().toLocaleString('es-AR')}
      </div>
    </div>
  </div>`;
}

// ── Inicialización ──
window.openEdit=openEdit;
window.openList=openList;
window.openNew=openNew;
window.generarPDF=generarPDF;
window.saveDoc=saveDoc;
window.toggleObs=toggleObs;
window.openModalFueraLeo=openModalFueraLeo;
loadStorage();
loadClientesDB();
initGlobalEvents();
</script>
  <!-- Popover generación PDF -->
  <div id="pdf-popover" style="display:none;position:fixed;z-index:9999;background:#fff;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:14px 16px;width:260px;font-family:var(--font-sans);">
    <div style="font-size:11px;font-weight:600;color:#1d3557;margin-bottom:10px;">⬇ ¿Qué querés generar?</div>
    <div style="display:flex;flex-direction:column;gap:7px;">
      <button onclick="ejecutarPDF('presupuesto')" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:11px;font-family:var(--font-sans);text-align:left;display:flex;align-items:center;gap:8px;"><span style="font-size:16px;">📄</span><span><strong>Presupuesto</strong><br><span style="color:#6b7280;font-size:10px;">Documento completo</span></span></button>
      <button onclick="ejecutarPDF('etiqueta')" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:11px;font-family:var(--font-sans);text-align:left;display:flex;align-items:center;gap:8px;"><span style="font-size:16px;">🏷</span><span><strong>Etiqueta de muestra</strong><br><span style="color:#6b7280;font-size:10px;">4 etiquetas por hoja A4</span></span></button>
      <button onclick="ejecutarPDF('ambos')" style="padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;background:#f9fafb;cursor:pointer;font-size:11px;font-family:var(--font-sans);text-align:left;display:flex;align-items:center;gap:8px;"><span style="font-size:16px;">📄🏷</span><span><strong>Ambos</strong><br><span style="color:#6b7280;font-size:10px;">Presupuesto + etiqueta</span></span></button>
      <button onclick="cerrarPopoverPDF()" style="padding:6px;border:none;background:none;cursor:pointer;font-size:10px;color:#9ca3af;font-family:var(--font-sans);">Cancelar</button>
    </div>
  </div>

  <!-- Popover de envío al cliente -->
  <div id="envio-popover" style="display:none;position:fixed;z-index:9999;background:#fff;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:14px 16px;width:280px;font-family:var(--font-sans);">
    <div style="font-size:11px;font-weight:600;color:#1d3557;margin-bottom:8px;">✉ Registrar envío al cliente</div>
    <div style="font-size:10px;color:#6b7280;margin-bottom:8px;" id="envio-doc-info"></div>
    <label style="font-size:10px;color:#374151;display:block;margin-bottom:3px;">Enviado por</label>
    <input id="envio-quien" type="text" placeholder="Tu nombre" style="width:100%;font-size:11px;border:0.5px solid #d1d5db;border-radius:4px;padding:4px 8px;font-family:var(--font-sans);box-sizing:border-box;margin-bottom:8px;">
    <label style="font-size:10px;color:#374151;display:block;margin-bottom:3px;">Nota (opcional)</label>
    <input id="envio-nota" type="text" placeholder="Ej: enviado por email" style="width:100%;font-size:11px;border:0.5px solid #d1d5db;border-radius:4px;padding:4px 8px;font-family:var(--font-sans);box-sizing:border-box;margin-bottom:10px;">
    <div style="display:flex;gap:6px;">
      <button onclick="confirmarEnvio()" style="flex:1;padding:6px;border:none;border-radius:4px;background:#8b5cf6;color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font-sans);">Confirmar envío</button>
      <button onclick="cerrarPopoverEnvio()" style="padding:6px 10px;border:1px solid #d1d5db;border-radius:4px;background:#fff;font-size:11px;cursor:pointer;font-family:var(--font-sans);">Cancelar</button>
    </div>
  </div>
</body>
</html>
